[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gossip-simulator"
version = "0.1.0"
description = "Simulador de eventos discretos para avaliar protocolos Gossip."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1,<5",
    "numpy>=1.26,<3",
    "networkx>=3.2,<4",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
experiments = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.15",
    "scipy>=1.12,<2",
    "optuna>=4,<5",
]
dev = [
    "pytest>=8,<10",
]

# Nesta estrutura, `src/` e o nome do pacote importavel.
# Mantenha src/__init__.py e src/policies/__init__.py.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]